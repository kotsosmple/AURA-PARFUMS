<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the notes, season, and character of the AURA PARFUMS collection.">
    <title>AURA PARFUMS | Fragrance Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,300;0,500;0,600;1,300;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="product.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand-lockup">
                <span>AURA</span>
                <small>PARFUMS</small>
            </div>
            <nav class="utility-nav">
                <a href="index.html#collection">Collection</a>
                <a href="index.html#heritage">Story</a>
                <a href="index.html#bag" class="nav-cta">Bag (<span class="bag-count">0</span>)</a>
            </nav>
        </header>

        <main>
            <section class="product-hero">
                <div class="hero-copy">
                    <p class="eyebrow product-eyebrow">AURA / FINE FRAGRANCE</p>
                    <h1 class="detail-product-name">Fine Fragrance</h1>
                    <p class="lede product-lede"></p>
                    <p class="product-page-price"></p>
                    <fieldset class="variant-selector">
                        <legend>SELECT SIZE</legend>
                        <div class="variant-options product-variant-options"></div>
                    </fieldset>
                    <dl class="product-context">
                        <div class="context-item">
                            <dt>IDEAL SEASON</dt>
                            <dd class="product-season"></dd>
                        </div>
                        <div class="context-item">
                            <dt>TIME OF DAY</dt>
                            <dd class="product-time"></dd>
                        </div>
                    </dl>
                    <div class="hero-actions">
                        <button class="primary-btn product-add-button" type="button">Add to bag</button>
                        <button class="secondary-btn" type="button" data-scroll-target="#ingredients">Discover notes</button>
                    </div>
                </div>

                <div class="hero-visual">
                    <div class="glow-orb glow-one"></div>
                    <div class="glow-orb glow-two"></div>
                    <div class="perfume-shell">
                        <img src="" alt="" class="hero-bottle">
                    </div>
                </div>
            </section>

            <section class="ingredients-stage" id="ingredients">
                <div class="bottle-column" aria-label="AURA PARFUMS bottle">
                    <img src="" alt="" class="pin-bottle">
                </div>

                <div class="note-rail">
                    <header class="stage-header">
                        <p class="eyebrow">Olfactory Complex</p>
                        <h2>Top, heart, and base notes.</h2>
                    </header>

                    <div class="note-list" aria-label="Fragrance notes">
                    </div>
                </div>

                <section class="mobile-note-track" aria-roledescription="carousel" aria-label="Olfactory complex fragrance notes"></section>
            </section>

            <section class="cta-panel">
                <div class="cta-copy">
                    <p class="eyebrow">AURA PARFUMS</p>
                    <h3>Find your next signature.</h3>
                </div>
                <a class="primary-btn large" href="index.html#collection">Shop the collection</a>
            </section>
        </main>
    </div>

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="products.js"></script>
    <script src="product.js"></script>
</body>
</html>
